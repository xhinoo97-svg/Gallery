name: Final source-link audit cleanup

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feature/source-links'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/source-links
          fetch-depth: 0

      - name: Apply cleanup, restore workflows, and sync branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/source-links
          git checkout feature/source-links
          git merge origin/main --no-edit

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt')
          text = path.read_text()

          old_import = 'import org.fossify.gallery.helpers.RECYCLE_BIN\n'
          new_import = (
              'import org.fossify.gallery.helpers.RECYCLE_BIN\n'
              'import org.fossify.gallery.helpers.SourceLinkPreferences\n'
          )
          if 'import org.fossify.gallery.helpers.SourceLinkPreferences\n' not in text:
              if text.count(old_import) != 1:
                  raise SystemExit('Expected one RECYCLE_BIN import')
              text = text.replace(old_import, new_import, 1)

          old = '''    deleteFile(fileDirItem, allowDeleteFolder, isDeletingMultipleFiles = false) {
        if (deleteFromDatabase) {
            ensureBackgroundThread {
                deleteDBPath(fileDirItem.path)
                runOnUiThread {
                    callback?.invoke(it)
                }
            }
        } else {
            callback?.invoke(it)
        }
    }
'''
          new = '''    deleteFile(fileDirItem, allowDeleteFolder, isDeletingMultipleFiles = false) { wasSuccess ->
        if (wasSuccess) {
            SourceLinkPreferences.remove(this, fileDirItem.path)
        }

        if (deleteFromDatabase) {
            ensureBackgroundThread {
                deleteDBPath(fileDirItem.path)
                runOnUiThread {
                    callback?.invoke(wasSuccess)
                }
            }
        } else {
            callback?.invoke(wasSuccess)
        }
    }
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not find tryDeleteFileDirItem implementation')

          path.write_text(text)
          PY

          cat > .github/workflows/build-source-links.yml <<'YAML'
          name: Build Source Links APK

          on:
            workflow_dispatch:
            pull_request:
              branches:
                - main

          jobs:
            build:
              runs-on: ubuntu-latest
              permissions:
                contents: read

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Make Gradle executable
                  run: chmod +x gradlew

                - name: Build FOSS debug APK
                  run: ./gradlew assembleFossDebug --stacktrace

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: GinoGallery-debug-apk
                    path: app/build/outputs/apk/foss/debug/*.apk
                    if-no-files-found: error
          YAML

          rm -f .github/workflows/source-audit-target.yml
          rm -f .github/workflows/apply-source-delete-cleanup.yml
          rm -f .source-audit-trigger
          git add app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt .github/workflows/build-source-links.yml .github/workflows/source-audit-target.yml .github/workflows/apply-source-delete-cleanup.yml .source-audit-trigger
          git commit -m "Finalize source-link deletion cleanup"
          git push origin HEAD:feature/source-links

          git checkout -B main origin/main
          cat > .github/workflows/build-source-links.yml <<'YAML'
          name: Build Source Links APK

          on:
            workflow_dispatch:
            pull_request:
              branches:
                - main

          jobs:
            build:
              runs-on: ubuntu-latest
              permissions:
                contents: read

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Make Gradle executable
                  run: chmod +x gradlew

                - name: Build FOSS debug APK
                  run: ./gradlew assembleFossDebug --stacktrace

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: GinoGallery-debug-apk
                    path: app/build/outputs/apk/foss/debug/*.apk
                    if-no-files-found: error
          YAML
          rm -f .github/workflows/source-audit-target.yml
          git add .github/workflows/build-source-links.yml .github/workflows/source-audit-target.yml
          git commit -m "Restore normal APK workflow after audit"
          git push origin HEAD:main

          git fetch origin main
          git checkout feature/source-links
          git merge origin/main --no-edit
          git push origin HEAD:feature/source-links
