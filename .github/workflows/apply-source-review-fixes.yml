name: Apply source review fixes

on:
  push:
    branches:
      - feature/source-links

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply source link integration review fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/source-links
          fetch-depth: 0

      - name: Apply verified integration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/fossify/gallery/activities/ViewPagerActivity.kt')
          text = path.read_text()

          replacements = [
              (
                  'import org.fossify.gallery.helpers.SKIP_AUTHENTICATION\n',
                  'import org.fossify.gallery.helpers.SKIP_AUTHENTICATION\n'
                  'import org.fossify.gallery.helpers.SourceLinkManager\n'
                  'import org.fossify.gallery.helpers.SourceLinkPreferences\n',
              ),
              (
                  '    override val appBarLayout: AppBarLayout\n'
                  '        get() = binding.mediumViewerAppbar\n\n'
                  '    override fun onCreate(savedInstanceState: Bundle?) {',
                  '    override val appBarLayout: AppBarLayout\n'
                  '        get() = binding.mediumViewerAppbar\n\n'
                  '    protected override fun getCurrentSourcePath(): String = getCurrentPath()\n\n'
                  '    override fun onCreate(savedInstanceState: Bundle?) {',
              ),
              (
                  '                R.id.menu_create_shortcut -> createShortcut()\n'
                  '                R.id.menu_resize -> resizeImage()',
                  '                R.id.menu_create_shortcut -> createShortcut()\n'
                  '                R.id.menu_source_link -> SourceLinkManager.handle(this, getCurrentPath())\n'
                  '                R.id.menu_resize -> resizeImage()',
              ),
              (
                  '            if (!isCopyOperation) {\n'
                  '                refreshViewPager()\n'
                  '                updateFavoritePaths(fileDirItems, it)\n'
                  '            }',
                  '            if (!isCopyOperation) {\n'
                  '                SourceLinkPreferences.move(this, currPath, newPath)\n'
                  '                refreshViewPager()\n'
                  '                updateFavoritePaths(fileDirItems, it)\n'
                  '            }',
              ),
              (
                  '            ensureBackgroundThread {\n'
                  '                updateDBMediaPath(oldPath, it)\n'
                  '            }\n'
                  '            updateActionbarTitle()',
                  '            ensureBackgroundThread {\n'
                  '                updateDBMediaPath(oldPath, it)\n'
                  '            }\n'
                  '            SourceLinkPreferences.move(this, oldPath, it)\n'
                  '            updateActionbarTitle()',
              ),
              (
                  '            binding.mediumViewerAppbar.animate().alpha(newAlpha).withStartAction {\n'
                  '                binding.mediumViewerAppbar.beVisible()\n'
                  '            }.withEndAction {\n'
                  '                binding.mediumViewerAppbar.beVisibleIf(newAlpha == 1f)\n'
                  '            }.start()\n',
                  '            binding.mediumViewerAppbar.animate().alpha(newAlpha).withStartAction {\n'
                  '                binding.mediumViewerAppbar.beVisible()\n'
                  '            }.withEndAction {\n'
                  '                binding.mediumViewerAppbar.beVisibleIf(newAlpha == 1f)\n'
                  '            }.start()\n\n'
                  '            binding.sourceLinkButton.animate().alpha(newAlpha).withStartAction {\n'
                  '                if (newAlpha == 1f) {\n'
                  '                    refreshSourceLinkButton()\n'
                  '                }\n'
                  '            }.withEndAction {\n'
                  '                if (newAlpha == 0f) {\n'
                  '                    binding.sourceLinkButton.visibility = View.GONE\n'
                  '                }\n'
                  '            }.start()\n',
              ),
              (
                  '    override fun onPageSelected(position: Int) {\n'
                  '        if (mPos != position) {\n'
                  '            mPos = position\n'
                  '            updateActionbarTitle()\n'
                  '            refreshMenuItems()\n'
                  '            scheduleSwipe()\n'
                  '        }\n'
                  '    }',
                  '    override fun onPageSelected(position: Int) {\n'
                  '        if (mPos != position) {\n'
                  '            mPos = position\n'
                  '            updateActionbarTitle()\n'
                  '            refreshMenuItems()\n'
                  '            scheduleSwipe()\n'
                  '        }\n'
                  '        refreshSourceLinkButton()\n'
                  '    }',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/apply-source-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/fossify/gallery/activities/ViewPagerActivity.kt .github/workflows/apply-source-review-fixes.yml
          git commit -m "Apply source link integration review fixes"
          git push origin HEAD:feature/source-links
