name: Apply source-link tracking fixes

on:
  push:
    branches:
      - feature/source-links

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Preserve source links across visibility and external renames'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/source-links
          fetch-depth: 0

      - name: Apply reviewed tracking changes
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          activity_path = Path("app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt")
          activity = activity_path.read_text()

          import_anchor = "import org.fossify.gallery.helpers.RECYCLE_BIN\n"
          source_import = "import org.fossify.gallery.helpers.SourceLinkPreferences\n"
          if source_import not in activity:
              if activity.count(import_anchor) != 1:
                  raise SystemExit("Expected exactly one RECYCLE_BIN import")
              activity = activity.replace(
                  import_anchor,
                  import_anchor + source_import,
                  1,
              )

          old_visibility = """    renameFile(oldPath, newPath, false) { success, useAndroid30Way ->
              runOnUiThread {
                  callback?.invoke(newPath)
              }

              ensureBackgroundThread {
                  updateDBMediaPath(oldPath, newPath)
              }
          }
          """
          new_visibility = """    renameFile(oldPath, newPath, false) { success, useAndroid30Way ->
              if (success) {
                  SourceLinkPreferences.move(this, oldPath, newPath)
              }

              runOnUiThread {
                  callback?.invoke(newPath)
              }

              ensureBackgroundThread {
                  updateDBMediaPath(oldPath, newPath)
              }
          }
          """
          if new_visibility not in activity:
              if activity.count(old_visibility) != 1:
                  raise SystemExit("Expected exactly one toggleFileVisibility rename callback")
              activity = activity.replace(old_visibility, new_visibility, 1)

          activity_path.write_text(activity)

          source_preferences = Path(
              "app/src/main/kotlin/org/fossify/gallery/helpers/SourceLinkPreferences.kt"
          )
          source_preferences.write_bytes(b64decode(" "))
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/apply-source-link-tracking-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt \
            app/src/main/kotlin/org/fossify/gallery/helpers/SourceLinkPreferences.kt \
            .github/workflows/apply-source-link-tracking-fixes.yml
          git commit -m "Preserve source links across visibility and external renames"
          git push origin HEAD:feature/source-links
