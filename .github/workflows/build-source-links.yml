name: Build Source Links APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/source-links
          fetch-depth: 0

      - name: Apply reviewed deletion cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt')
          text = path.read_text()

          old_import = 'import org.fossify.gallery.helpers.RECYCLE_BIN\n'
          new_import = (
              'import org.fossify.gallery.helpers.RECYCLE_BIN\n'
              'import org.fossify.gallery.helpers.SourceLinkPreferences\n'
          )
          if text.count(old_import) != 1:
              raise SystemExit('Expected one RECYCLE_BIN import')
          text = text.replace(old_import, new_import, 1)

          old = '''    deleteFile(fileDirItem, allowDeleteFolder, isDeletingMultipleFiles = false) {
        if (deleteFromDatabase) {
            ensureBackgroundThread {
                deleteDBPath(fileDirItem.path)
                runOnUiThread {
                    callback?.invoke(it)
                }
            }
        } else {
            callback?.invoke(it)
        }
    }
'''
          new = '''    deleteFile(fileDirItem, allowDeleteFolder, isDeletingMultipleFiles = false) { wasSuccess ->
        if (wasSuccess) {
            SourceLinkPreferences.remove(this, fileDirItem.path)
        }

        if (deleteFromDatabase) {
            ensureBackgroundThread {
                deleteDBPath(fileDirItem.path)
                runOnUiThread {
                    callback?.invoke(wasSuccess)
                }
            }
        } else {
            callback?.invoke(wasSuccess)
        }
    }
'''
          if text.count(old) != 1:
              raise SystemExit('Expected one tryDeleteFileDirItem implementation')
          path.write_text(text.replace(old, new, 1))
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/build-source-links.yml
          rm -f .github/workflows/apply-source-delete-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/fossify/gallery/extensions/Activity.kt .github/workflows/build-source-links.yml .github/workflows/apply-source-delete-cleanup.yml
          git commit -m "Clean source links after successful media deletion"
          git push origin HEAD:feature/source-links

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GinoGallery-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
